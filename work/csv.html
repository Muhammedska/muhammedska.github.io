<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesin Çözüm CSV Düzeltici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased p-6 min-h-screen flex items-center justify-center">

    <div class="max-w-5xl w-full space-y-6">
        
        <div class="bg-white rounded-xl shadow-md p-8 border border-gray-200 text-center">
            <h1 class="text-3xl font-extrabold text-red-700 mb-3">
                <i class="fa-solid fa-calendar-check mr-2"></i> Akıllı Tarih Çözücü
            </h1>
            <p class="text-gray-600 font-medium">
                Bu versiyon her türlü karmaşık tarihi (YYYY-MM-DD, MM/DD/YYYY, D.M.YY vb.) analiz edip zorla <strong>GG.AA.YYYY</strong> yapar.
            </p>
        </div>

        <div class="bg-white rounded-xl shadow-md p-8 border border-gray-200">
            <div class="flex flex-col md:flex-row items-center gap-6">
                
                <div class="w-full md:w-1/2">
                    <label class="block text-sm font-bold text-gray-700 mb-3">Virgüllü (,) CSV Dosyanı Seç:</label>
                    <input type="file" id="fileInput" accept=".csv" class="block w-full text-sm text-gray-600
                        file:mr-4 file:py-3 file:px-4
                        file:rounded-lg file:border-0
                        file:text-sm file:font-bold
                        file:bg-red-50 file:text-red-800
                        hover:file:bg-red-100 cursor-pointer 
                        border-2 border-dashed border-gray-300 rounded-lg p-4
                        transition-all focus:outline-none focus:border-red-500" />
                </div>
                
                <div id="statusArea" class="hidden w-full md:w-1/2 flex flex-col items-center justify-center bg-green-50 rounded-lg p-6 border-2 border-green-200">
                    <div class="text-green-700 font-bold mb-3 flex items-center gap-2 text-lg">
                        <i class="fa-solid fa-check-double"></i> İşlem Tamam!
                    </div>
                    <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg shadow-lg transition-transform transform hover:scale-105 flex items-center gap-2 font-bold w-full justify-center">
                        <i class="fa-solid fa-download"></i> Noktalı Virgülle (;) İndir
                    </button>
                </div>
                
            </div>
        </div>

        <div id="previewContainer" class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden hidden">
            <div class="px-6 py-3 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h3 class="text-sm font-bold text-gray-700 uppercase">Önizleme (İlk 15 Satır)</h3>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm">
                    <thead id="tableHead" class="bg-gray-800 text-white">
                        <!-- Başlık -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200 bg-white">
                        <!-- Veri -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const TARGET_HEADER = ["KURUL_NO", "TARİH", "", "GÜN", "SAAT", "DERS", "ÖĞRETİM_ÜYESİ", "T/P", "BÖLÜM", "TEMA", "HAFTA"];
        
        const INPUT_DELIMITER = ','; // Okurken virgül
        const OUTPUT_DELIMITER = ';'; // Çıktı noktalı virgül
        
        let processedCSVData = [];
        let originalFileName = "";

        const fileInput = document.getElementById('fileInput');
        const statusArea = document.getElementById('statusArea');
        const downloadBtn = document.getElementById('downloadBtn');
        const previewContainer = document.getElementById('previewContainer');
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalFileName = file.name;
            const reader = new FileReader();

            reader.onload = function(event) {
                processCSV(event.target.result);
            };

            reader.readAsText(file, 'UTF-8');
        });

        function parseCSVText(text, delimiter) {
            let rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i+1];

                if (char === '"' && nextChar === '"' && inQuotes) { 
                    currentCell += '"'; i++;
                } else if (char === '"') {
                    inQuotes = !inQuotes; 
                } else if (char === delimiter && !inQuotes) { 
                    currentRow.push(currentCell); currentCell = '';
                } else if ((char === '\n' || (char === '\r' && nextChar === '\n')) && !inQuotes) {
                    if (char === '\r') i++; 
                    currentRow.push(currentCell);
                    rows.push(currentRow);
                    currentRow = []; currentCell = '';
                } else if (char !== '\r') {
                    currentCell += char; 
                }
            }
            if (currentRow.length > 0 || currentCell !== '') {
                currentRow.push(currentCell);
                rows.push(currentRow);
            }
            return rows;
        }

        // --- AKILLI TARİH DÜZELTİCİ ---
        function fixDate(rawDateString) {
            // 1. Boşlukları ve saatleri at (örn: "2023-05-12 14:30:00" -> "2023-05-12")
            let dateOnly = rawDateString.trim().split(' ')[0];
            
            // 2. Harfleri temizle, sadece rakam ve yaygın ayırıcılar kalsın
            dateOnly = dateOnly.replace(/[^0-9.\/-]/g, '');

            // 3. Herhangi bir ayırıcıya göre parçala
            let parts = dateOnly.split(/[.\/-]/);

            if (parts.length !== 3) {
                return rawDateString; // Eğer 3 parça değilse (örn sadece yıl), dokunma
            }

            let p1 = parseInt(parts[0], 10);
            let p2 = parseInt(parts[1], 10);
            let p3 = parseInt(parts[2], 10);

            if (isNaN(p1) || isNaN(p2) || isNaN(p3)) {
                return rawDateString; // Rakam değilse dokunma
            }

            let day, month, year;

            // Senaryo A: Yıl Başta (YYYY-MM-DD veya YYYY/MM/DD)
            if (p1 > 1000) {
                year = p1;
                month = p2;
                day = p3;
            } 
            // Senaryo B: Yıl Sonda (DD.MM.YYYY veya MM/DD/YYYY)
            else if (p3 > 1000 || p3 > 31) { // Eğer son parça 31'den büyükse kesin yıldır (örn 99 -> 1999)
                year = p3;
                
                // Gün mü Ay mı karmaşası?
                if (p1 > 12) {
                    // İlk parça 12'den büyükse, kesinlikle GÜNDÜR (örn: 25/05/2023)
                    day = p1;
                    month = p2;
                } else if (p2 > 12) {
                    // İkinci parça 12'den büyükse, o GÜNDÜR (Amerikan formatı: 05/25/2023)
                    month = p1;
                    day = p2;
                } else {
                    // İkisi de 12'den küçükse (örn: 05/06/2023). 
                    // Türkiye standardında ilkini gün kabul ediyoruz.
                    day = p1;
                    month = p2;
                }
            }
            // Senaryo C: Tüm parçalar küçük (DD.MM.YY - Örn: 12.05.24)
            else {
                 if (p1 > 12) {
                    day = p1; month = p2; year = p3;
                 } else if (p2 > 12) {
                    month = p1; day = p2; year = p3;
                 } else {
                    day = p1; month = p2; year = p3;
                 }
            }

            // Yılı 4 haneye tamamla
            if (year < 100) {
                year = year > 50 ? 1900 + year : 2000 + year; // 99 -> 1999, 24 -> 2024
            }

            // Çıktıyı zorla GG.AA.YYYY yap
            let formattedDay = day.toString().padStart(2, '0');
            let formattedMonth = month.toString().padStart(2, '0');
            
            // Eğer absürt bir tarih oluştuysa (örn Ay 13 olduysa) orijinaline dön
            if (month < 1 || month > 12 || day < 1 || day > 31) {
                return rawDateString;
            }

            return `${formattedDay}.${formattedMonth}.${year}`;
        }

        function processCSV(text) {
            const parsedRows = parseCSVText(text, INPUT_DELIMITER);
            processedCSVData = [TARGET_HEADER]; 

            for (let i = 1; i < parsedRows.length; i++) {
                let row = parsedRows[i];
                if (row.length === 0 || (row.length === 1 && row[0].trim() === "")) continue;

                // TARİH SÜTUNU (İndeks 1) İşlemi
                if (row.length > 1 && row[1]) {
                    row[1] = fixDate(row[1]);
                }
                
                // Başlık sayısına kadar eksik hücreleri doldur
                let paddedRow = [];
                for(let j = 0; j < TARGET_HEADER.length; j++) {
                    paddedRow.push(row[j] !== undefined ? row[j] : "");
                }
                
                processedCSVData.push(paddedRow);
            }

            renderTable(processedCSVData);
            
            statusArea.classList.remove('hidden');
            previewContainer.classList.remove('hidden');
        }

        function renderTable(rows) {
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            if (rows.length === 0) return;

            const trHead = document.createElement('tr');
            rows[0].forEach(cell => {
                const th = document.createElement('th');
                th.className = "px-4 py-3 font-bold uppercase tracking-wider whitespace-nowrap";
                th.textContent = cell;
                trHead.appendChild(th);
            });
            tableHead.appendChild(trHead);

            const limit = Math.min(rows.length, 16); 
            for (let i = 1; i < limit; i++) {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-red-50";
                
                for(let j = 0; j < TARGET_HEADER.length; j++) {
                    const td = document.createElement('td');
                    td.className = "px-4 py-2 border-b border-gray-100 whitespace-nowrap";
                    
                    if (j === 1 && rows[i][j] !== "") { 
                        td.innerHTML = `<span class="bg-red-100 text-red-900 font-bold px-2 py-1 rounded">${rows[i][j]}</span>`;
                    } else {
                        td.textContent = rows[i][j];
                    }
                    tr.appendChild(td);
                }
                tableBody.appendChild(tr);
            }
        }

        downloadBtn.addEventListener('click', function() {
            if (processedCSVData.length === 0) return;

            const csvContent = processedCSVData.map(row => {
                return row.map(cell => {
                    let str = String(cell);
                    if (str.includes(OUTPUT_DELIMITER) || str.includes('\n') || str.includes('"')) {
                        return `"${str.replace(/"/g, '""')}"`;
                    }
                    return str;
                }).join(OUTPUT_DELIMITER); 
            }).join('\r\n');

            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]); 
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const newFileName = `date_correct_${originalFileName.replace(".csv", "")}.csv`;

            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', newFileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

    </script>
</body>
</html>
