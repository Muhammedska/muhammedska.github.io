    const answers = {};
    let totalQuestions = 0;

    function parseQuestions(text) {
        const lines = text.split('\n');
        const questions = [];

        lines.forEach(line => {
            const match = line.match(/^(\d+)\.\s*(.*)/);
            if (match) {
                questions.push({
                    id: parseInt(match[1]),
                    text: match[2].trim()
                });
            }
        });
        return questions;
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        const questions = parseQuestions(rawData);
        totalQuestions = questions.length;

        document.getElementById('progress').innerText = `Yanıtlanan: 0 / ${totalQuestions}`;

        questions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${q.id}`;

            card.innerHTML = `
                <div class="question-text">${q.id}. ${q.text}</div>
                <div class="options">
                    <label class="radio-label">
                        <input type="radio" name="q${q.id}" value="Dogru" onchange="handleAnswer(${q.id}, 'Dogru')">
                        Doğru
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="q${q.id}" value="Yanlis" onchange="handleAnswer(${q.id}, 'Yanlis')">
                        Yanlış
                    </label>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function handleAnswer(questionId, value) {
        answers[questionId] = value;
        const answeredCount = Object.keys(answers).length;
        document.getElementById('progress').innerText = `Yanıtlanan: ${answeredCount} / ${totalQuestions}`;
    }

    function exportData(format) {
        const answeredCount = Object.keys(answers).length;
        if (answeredCount < totalQuestions) {
            const confirmExport = confirm(`Henüz ${totalQuestions - answeredCount} soruyu yanıtlamadınız. Yine de dışa aktarmak istiyor musunuz?`);
            if (!confirmExport) return;
        }

        let dataStr, mimeType, extension;

        if (format === 'json') {
            dataStr = JSON.stringify(answers, null, 2);
            mimeType = 'application/json';
            extension = 'json';
        } else if (format === 'csv') {
            const header = "Soru_No,Yanit\n";
            const rows = Object.keys(answers).map(key => `${key},${answers[key]}`).join("\n");
            dataStr = header + rows;
            mimeType = 'text/csv';
            extension = 'csv';
        }

        const blob = new Blob([dataStr], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        link.href = url;
        link.download = `mmpi_sonuclar_${new Date().toISOString().split('T')[0]}.${extension}`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    window.onload = renderQuestions;
</script>
