    <style>
        :root {
            --bg-mint: #c7e8d5;
            --bg-yellow: #fde047;
            --bg-pink: #fbcfe8;
            --brutal-black: #111827;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background-color: #60a5fa; /* Dış arka plan (mavi) */
            background-image: 
                linear-gradient(45deg, #fbcfe8 25%, transparent 25%), 
                linear-gradient(-45deg, #fbcfe8 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #fde047 75%), 
                linear-gradient(-45deg, transparent 75%, #fde047 75%);
            background-size: 100vw 100vh;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-mono-heading {
            font-family: 'Space Mono', monospace;
        }

        /* Neo-brutalism sınıfları */
        .brutal-border {
            border: 3px solid var(--brutal-black);
        }

        .brutal-shadow {
            box-shadow: 6px 6px 0px 0px var(--brutal-black);
        }

        .brutal-shadow-sm {
            box-shadow: 3px 3px 0px 0px var(--brutal-black);
        }

        .brutal-shadow-hover {
            transition: all 0.2s ease;
        }

        .brutal-shadow-hover:hover {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0px 0px var(--brutal-black);
        }
        
        .brutal-shadow-hover:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px 0px var(--brutal-black);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-left: 3px solid var(--brutal-black);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-yellow); 
            border: 3px solid var(--brutal-black);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #eab308; 
        }

        /* Expand animation */
        .examples-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .examples-container.expanded {
            max-height: 1000px; /* Arbitrary large number */
            border-top: 3px solid var(--brutal-black);
        }
    </style>
</head>

        ];

        const container = document.getElementById('verbsContainer');

        const bgColors = ['bg-[#fde047]', 'bg-white', 'bg-[#c7e8d5]', 'bg-[#fbcfe8]'];

        function renderVerbs(filterTerm = '') {
            container.innerHTML = ''; // Temizle
            
            const lowerTerm = filterTerm.toLowerCase().trim();
            const filtered = verbsData.filter(v => 
                v.v1.toLowerCase().includes(lowerTerm) || 
                v.v2.toLowerCase().includes(lowerTerm) || 
                v.v3.toLowerCase().includes(lowerTerm) || 
                v.tr.toLowerCase().includes(lowerTerm)
            );

            countDisplay.innerText = `${filtered.length} words`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-10 bg-white brutal-border brutal-shadow text-center">
                        <i class="fa-solid fa-face-frown text-4xl mb-4"></i>
                        <h3 class="text-2xl font-bold font-mono-heading">No results found!</h3>
                        <p class="text-gray-600">Try searching for something else.</p>
                    </div>`;
                return;
            }

            filtered.forEach((verb, index) => {
                const colorClass = bgColors[index % bgColors.length];
                
                // Kart HTML Yapısı
                const card = document.createElement('div');
                card.className = `brutal-border ${colorClass} brutal-shadow brutal-shadow-hover flex flex-col cursor-pointer transition-all`;
                card.innerHTML = `
                    <div class="p-5 flex flex-col h-full card-header">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-2xl font-bold font-mono-heading">${verb.v1}</h3>
                                <p class="text-sm font-bold uppercase tracking-wider mt-1 opacity-75">${verb.tr}</p>
                            </div>
                            <div class="w-8 h-8 brutal-border bg-white flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-plus expand-icon transition-transform"></i>
                            </div>
                        </div>

                        <div class="flex gap-2 mt-auto">
                            <div class="flex-1 bg-white brutal-border p-2 text-center brutal-shadow-sm">
                                <span class="text-[10px] font-bold uppercase block mb-1">V2 (Past)</span>
                                <span class="font-bold">${verb.v2}</span>
                            </div>
                            <div class="flex-1 bg-white brutal-border p-2 text-center brutal-shadow-sm">
                                <span class="text-[10px] font-bold uppercase block mb-1">V3 (Participle)</span>
                                <span class="font-bold">${verb.v3}</span>
                            </div>
                        </div>
                    </div>

                    <div class="examples-container bg-white">
                        <div class="p-5 space-y-4">
                            ${verb.examples.map(ex => `
                                <div class="p-3 border-l-4 border-black bg-gray-50 relative">
                                    <span class="absolute -top-3 left-2 bg-[#fde047] brutal-border px-2 py-0.5 text-[10px] font-bold shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                        ${ex.t} Example
                                    </span>
                                    <p class="font-bold text-[15px] mt-1 text-gray-900">${ex.en}</p>
                                    <p class="text-sm italic text-gray-600 mt-1">${ex.tr}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                // Accordion Click Olayı
                const header = card.querySelector('.card-header');
                const examplesBox = card.querySelector('.examples-container');
                const icon = card.querySelector('.expand-icon');

                header.addEventListener('click', () => {
                    const isExpanded = examplesBox.classList.contains('expanded');
                    
                    // Diğer tüm açık olanları kapat (Opsiyonel, daha temiz UX için)
                    document.querySelectorAll('.examples-container.expanded').forEach(el => {
                        if(el !== examplesBox) {
                            el.classList.remove('expanded');
                            el.parentElement.querySelector('.expand-icon').classList.replace('fa-minus', 'fa-plus');
                        }
                    });

                    // Tıklananı aç/kapat
                    if (isExpanded) {
                        examplesBox.classList.remove('expanded');
                        icon.classList.replace('fa-minus', 'fa-plus');
                    } else {
                        examplesBox.classList.add('expanded');
                        icon.classList.replace('fa-plus', 'fa-minus');
                    }
                });

                container.appendChild(card);
            });
        }

        // Arama Event Listener
        searchInput.addEventListener('input', (e) => {
            renderVerbs(e.target.value);
        });

        // İlk Yükleme
        renderVerbs();
